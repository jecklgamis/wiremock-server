name: Perf Test
on:
  workflow_dispatch:
jobs:
  perf-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install resonate
        run: go install github.com/jecklgamis/resonate/cmd/resonate@latest
      - name: Build Docker image
        run: docker build -t wiremock-server:main .
      - name: Start app
        run: |
          docker run -d -p 8080:8080 wiremock-server:main
          for i in $(seq 1 90); do curl -sf localhost:8080/ && break; sleep 1; done
      - name: Run load test
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          ./run-perf-tests.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-test-report
          path: perf-tests/*-report.*
